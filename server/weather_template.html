<html>
<head>
<style>
  body {
    margin: 0; width: 800px; height: 480px;
    background: white; color: black;
    font-family: "Liberation Sans", Arial, Helvetica, sans-serif;
    box-sizing: border-box;
  }
  .wrap { padding: 30px 40px; }
  .location { font-size: 32px; font-weight: bold; }
  .updated { font-size: 16px; color: #444; margin-top: 2px; }
  .current { display: flex; align-items: baseline; margin-top: 10px; }
  .temp { font-size: 140px; font-weight: bold; line-height: 1; }
  .unit { font-size: 48px; font-weight: bold; margin-left: 6px; }
  .desc { font-size: 30px; margin-top: 4px; }
  .hilo { font-size: 22px; margin-top: 6px; color: #333; }
  hr { border: none; border-top: 3px solid black; margin: 20px 0; }
  .forecast { display: flex; justify-content: space-between; }
  .day { text-align: center; font-size: 20px; width: 18%; }
  .day .name { font-weight: bold; font-size: 22px; }
  .day .dhi { font-size: 22px; margin-top: 6px; }
  .day .dlo { font-size: 18px; color: #444; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="location">{{LOCATION}}</div>
    <div class="updated">Updated {{UPDATED}}</div>
    <div class="current">
      <div class="temp">{{CURRENT_TEMP}}</div><div class="unit">&deg;C</div>
    </div>
    <div class="desc">{{CURRENT_DESC}}</div>
    <div class="hilo">H:{{TODAY_HI}}&deg; L:{{TODAY_LO}}&deg;</div>
    <hr>
    <div class="forecast">
      <div class="day">
        <div class="name">{{DAY1_NAME}}</div>
        <div class="dhi">{{DAY1_HI}}&deg;</div>
        <div class="dlo">{{DAY1_LO}}&deg;</div>
      </div>
      <div class="day">
        <div class="name">{{DAY2_NAME}}</div>
        <div class="dhi">{{DAY2_HI}}&deg;</div>
        <div class="dlo">{{DAY2_LO}}&deg;</div>
      </div>
      <div class="day">
        <div class="name">{{DAY3_NAME}}</div>
        <div class="dhi">{{DAY3_HI}}&deg;</div>
        <div class="dlo">{{DAY3_LO}}&deg;</div>
      </div>
      <div class="day">
        <div class="name">{{DAY4_NAME}}</div>
        <div class="dhi">{{DAY4_HI}}&deg;</div>
        <div class="dlo">{{DAY4_LO}}&deg;</div>
      </div>
    </div>
  </div>
</body>
</html>
